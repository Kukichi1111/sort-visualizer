<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sort Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1>Sort Visualizer</h1>
    <div class="controls">
      <button id="play" class="primary">▶ 再生</button>
      <button id="reset">リセット</button>
      <label>速度
        <input id="speed" type="range" min="0" max="71" value="13">
        <output id="speedOut"></output>
      </label>
      <button id="recommend" title="n に合わせたおすすめ速度に戻す">おすすめ</button>
      <label title="O(n log n) のソートが全部終わったら、1秒ごとに速度を2倍にする">
        <input id="boost" type="checkbox" checked> 自動加速
      </label>
      <label>n
        <input id="n" type="number" min="8" max="10000" value="64" list="nPresets">
        <datalist id="nPresets">
          <option value="16"><option value="32"><option value="64"><option value="100">
          <option value="256"><option value="1000"><option value="3000"><option value="10000">
        </datalist>
      </label>
      <label>初期配列 <select id="kind"></select></label>
      <label>シード
        <input id="seed" type="number" value="1">
        <button id="reseed" title="シードをランダムに">🎲</button>
      </label>
    </div>
  </header>

  <ul class="legend">
    <li><i style="background:#f2c94c"></i>比較</li>
    <li><i style="background:#eb5757"></i>交換</li>
    <li><i style="background:#56ccf2"></i>コピー元</li>
    <li><i style="background:#3ecf8e"></i>コピー先</li>
    <li><i style="background:#bb6bd9"></i>ピボット</li>
    <li><i style="background:#4f8fd8"></i>確定</li>
    <li><i style="background:#c9a46a"></i>補助配列</li>
    <li><i style="background:#212634;border:1px solid #4a5060"></i>処理中の範囲</li>
  </ul>

  <main id="grid"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
